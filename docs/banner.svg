<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="simple-hifi">
  <defs>
    <style>
      @font-face { font-family: "BG"; font-weight: 700; src: url(data:font/woff2;base64,) format("woff2"); }
      .t { font: 700 112px "BG", "Bricolage Grotesque", system-ui, sans-serif; letter-spacing: -3px; fill: #fff; }
      .s { font: 400 30px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #ffe3de; }
    </style>
  </defs>
  <rect width="1280" height="360" rx="28" fill="#ef5a47"/>
  <circle cx="1180" cy="-40" r="190" fill="#ffffff" opacity=".07"/>
  <circle cx="60" cy="400" r="150" fill="#cf3f2c" opacity=".45"/>
  <text class="t" x="80" y="190">simple-hifi</text>
  <text class="s" x="84" y="252">A music player for little ones: one button to play,</text>
  <text class="s" x="84" y="294">one to change playlist, and a web page to add songs.</text>
  <rect x="1010" y="100" width="24" height="168" rx="12.0" fill="#ffc23d">
    <animate attributeName="height" values="42.0;168;42.0" dur="2.2s" begin="-0.2s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
    <animate attributeName="y" values="226.0;100;226.0" dur="2.2s" begin="-0.2s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
  </rect>
  <rect x="1050" y="100" width="24" height="168" rx="12.0" fill="#ffffff">
    <animate attributeName="height" values="42.0;168;42.0" dur="2.2s" begin="-0.7s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
    <animate attributeName="y" values="226.0;100;226.0" dur="2.2s" begin="-0.7s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
  </rect>
  <rect x="1090" y="100" width="24" height="168" rx="12.0" fill="#47b3ea">
    <animate attributeName="height" values="42.0;168;42.0" dur="2.2s" begin="-0.4s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
    <animate attributeName="y" values="226.0;100;226.0" dur="2.2s" begin="-0.4s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
  </rect>
  <rect x="1130" y="100" width="24" height="168" rx="12.0" fill="#4cc28d">
    <animate attributeName="height" values="42.0;168;42.0" dur="2.2s" begin="-0.9s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
    <animate attributeName="y" values="226.0;100;226.0" dur="2.2s" begin="-0.9s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
  </rect>
  <rect x="1170" y="100" width="24" height="168" rx="12.0" fill="#ffffff">
    <animate attributeName="height" values="42.0;168;42.0" dur="2.2s" begin="-0.1s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
    <animate attributeName="y" values="226.0;100;226.0" dur="2.2s" begin="-0.1s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
