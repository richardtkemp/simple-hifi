<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f28c28">
<title>Music</title>
<!-- use-credentials: behind Cloudflare Access the manifest fetch needs the Access cookie (MDN, link rel=manifest) -->
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="/icon-192.png">
<style>
  :root { --o: #f28c28; --bg: #fff8f0; --ink: #2b2118; --muted: #7a6a5c; --bad: #c0392b; --good: #2e8b57; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 17px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.4em; margin: 0.2em 0 0.6em; }
  h2 { font-size: 1.1em; margin: 1.4em 0 0.5em; }
  label { display: block; font-weight: 600; margin: 0.9em 0 0.3em; }
  textarea, select, input[type=text] { width: 100%; font: inherit; padding: 10px; border: 1px solid #d8c8b8;
    border-radius: 10px; background: #fff; color: inherit; }
  textarea { min-height: 6.5em; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 12px 18px; background: var(--o); color: #fff;
    font-weight: 600; }
  button:disabled { opacity: 0.5; }
  button.small { padding: 6px 12px; font-size: 0.9em; }
  #add { width: 100%; margin-top: 1em; }
  .hint { color: var(--muted); font-size: 0.9em; }
  .banner { background: #fff; border-left: 4px solid var(--o); padding: 10px 12px; border-radius: 6px; margin-bottom: 0.5em; }
  .msg { margin-top: 0.8em; padding: 10px 12px; border-radius: 8px; }
  .msg.bad { background: #fde8e6; color: var(--bad); }
  .msg.good { background: #e6f4ec; color: var(--good); }
  .job { background: #fff; border-radius: 10px; padding: 10px 12px; margin: 8px 0; box-shadow: 0 1px 2px #0001; }
  .job .t { font-weight: 600; overflow-wrap: anywhere; }
  .job .s { margin-top: 2px; }
  .job.done .s { color: var(--good); }
  .job.failed .s { color: var(--bad); }
  .bar { height: 6px; background: #f1e4d6; border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--o); width: 0; transition: width 0.5s; }
  details { margin-top: 6px; font-size: 0.9em; }
  details li.failed { color: var(--bad); }
  details li.done { color: var(--good); }
  .tech { color: var(--muted); font-size: 0.8em; white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <h1>🎵 Music</h1>
  <div id="shared" class="banner" hidden>Got your link. Choose an album, then press <b>Add</b>.</div>

  <label for="links">YouTube links</label>
  <textarea id="links" placeholder="Paste one or more YouTube links (videos or playlists), one per line"></textarea>
  <div class="hint">A playlist link adds the whole playlist, in its order.</div>

  <label for="album">Album</label>
  <select id="album"></select>
  <input id="newname" type="text" placeholder="Name of the new album" hidden maxlength="80">
  <div class="hint">New songs go at the end of the album.</div>

  <button id="add">Add</button>
  <div id="msg" class="msg" hidden></div>

  <h2>Downloads</h2>
  <div id="jobs"><div class="hint">Nothing yet.</div></div>
</main>
<script src="/app.js"></script>
</body>
</html>
